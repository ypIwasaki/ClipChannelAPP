<style>

ction:column;width:185px;background:#fff;border-right:1px solid #cbd9e8}.C .nav button{border:0;border-radius:0;border-left:3px solid transparent}.C .nav button.active{border-left-color:#2165c1}.workspace{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}.worktitle{padding:17px 22px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tabs{padding:0 22px 12px;display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid #ccd7e5}.content{padding:20px 22px;overflow:auto;flex:1;min-height:0}.columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}.panel{border:1px solid #c4d2e3;border-radius:10px;background:white;padding:18px;min-width:0}.B .columns{grid-template-columns:1fr}.B .panel{border-radius:0;border-width:0 0 1px;padding:15px 0}.C .columns{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.C .panel{border-radius:3px;border-top:3px solid #90b4e0}.field{display:block;margin:13px 0}.field span{display:block;font-weight:600;margin-bottom:5px}input,select,textarea{max-width:100%;border:1px solid #a9bcd3;border-radius:5px;background:#fff;padding:8px;color:#182d46}input,textarea{width:100%}textarea{resize:vertical;min-height:76px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.list{display:flex;flex-direction:column;gap:6px;margin:12px 0}.list button{overflow-wrap:anywhere;text-align:left}.preview{background:#172b43;aspect-ratio:16/9;display:grid;place-items:center;color:#fff;border:1px solid #91a9c6;border-radius:6px;position:relative;overflow:hidden}.scene{background:linear-gradient(145deg,#a9d3f1,#edf6ff 45%,#638fbd 46%,#c8ddbd);width:100%;height:100%;display:grid;place-items:center;color:#172b43;font-size:20px}.preview small{position:absolute;bottom:8px;background:#fff;padding:2px 6px}details{border:1px solid #bdcde1;border-radius:6px;padding:10px 13px;margin:14px 0;background:#f6f9fe}summary{cursor:pointer;font-weight:bold}.status{background:#fff;border-top:1px solid #bccfe6;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-shrink:0}.status .message{flex:1;min-width:0;max-height:100px;overflow:auto;overflow-wrap:anywhere}.status button{flex-shrink:0}.status.running{background:#edf4ff}.status.success{background:#edf8f1;color:#205d3a}.status.failure{background:#fff6e3;color:#755119}.C .status{border-top:4px solid #9abce5}.state{margin-top:14px;font-size:12px;overflow-wrap:anywhere;background:#f0f4fa;padding:10px;border-radius:6px}progress{width:100%;height:8px;accent-color:#2165c1}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#172b43;color:white;padding:8px 12px;border-radius:30px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 20px #172b4344;white-space:nowrap;z-index:10}.switcher button{border:0;background:#324a66;color:#fff;border-radius:50%}.dialog{max-width:min(620px,94vw);max-height:90vh;border:1px solid #afc3dd;border-radius:10px;padding:0;color:#182d46}.dialog::backdrop{background:#172b4366}.dialogbody{padding:22px;overflow:auto;max-height:65vh}.dialogfooter{padding:14px 22px;border-top:1px solid #ced8e6;display:flex;gap:8px;justify-content:flex-end}.notice{padding:10px;background:#fff4d9;color:#765213;border:1px solid #dcc286;border-radius:6px}.C .compactPicker{display:block}.compactPicker{display:none}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:12px}.legend span{border-left:5px solid var(--color);padding-left:6px}@container (max-width:820px){.columns,.C .columns{grid-template-columns:1fr}.B .nav{width:160px}.header{padding:10px 14px}.content{padding:14px}.worktitle{padding:12px 14px}.tabs{padding:0 14px 10px}}@container (max-width:620px){.B .shell,.C .shell{flex-direction:column}.B .nav,.C .nav{width:auto;flex-direction:row;flex-wrap:wrap;padding:8px;max-height:135px;overflow:auto}.nav button{padding:6px 8px!important;font-size:12px}.status{padding:8px;gap:8px}.status .message{max-height:65px}.header h1{font-size:16px}.header .path{font-size:12px}.C .nav{display:none}.worktitle h2{font-size:18px}}
.B .nav,.C .nav{overflow:auto;min-height:0}.header .path{max-height:72px;overflow:auto}.B .primary{background:#174f9b;border-color:#174f9b}.C{background:#f0f6ff}.C .primary{background:#075d9f;border-color:#075d9f}.C .nav button.active{background:#dceeff;color:#084c83}@container(max-width:950px){.status .message{max-height:72px}.header{padding:10px 14px}}
.B .header{order:0}.B .status{order:1;border-top:0;border-bottom:1px solid #bccfe6}.B .shell{order:2}
</style>
<style>
/* Selected C: fixed workspace; only lists and explicitly switched detail bodies scroll. */
.C .header{flex-shrink:0;flex-wrap:nowrap;padding:8px 12px;gap:12px}.C .header h1{font-size:17px}.C .header .path{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-height:44px}.C .header .path small{display:none}.C .nav{width:170px;padding:10px 6px;overflow:hidden}.C .nav button{font-size:13px;padding:8px 6px;flex-shrink:0}.C .worktitle{padding:8px 12px;flex-wrap:nowrap}.C .worktitle h2{font-size:18px;white-space:nowrap}.C .worktitle>.muted{display:none}.C .compactPicker{font-size:12px;margin-left:auto}.C .compactPicker select{padding:5px}.C .tabs{padding:0 12px 8px;gap:5px;flex-wrap:nowrap;flex-shrink:0}.C .tabs button{padding:5px 8px;font-size:13px}.C .content{overflow:hidden;padding:8px 12px;display:flex;flex-direction:column;gap:8px}.C .viewbar{display:flex;gap:5px;flex-shrink:0;align-items:center}.C .viewbar button{font-size:12px;padding:5px 8px}.C .viewbar .inspect{margin-left:auto}.C .columns{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;overflow:hidden}.C .panel{min-height:0;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}.C .panel[hidden]{display:none}.C .panelhead{display:flex;align-items:center;gap:6px;flex-shrink:0}.C .panelhead select{flex:1;min-width:0;padding:5px;font-size:13px}.C .panelhead button{padding:4px 8px}.C .pagebody{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}.C .pagebody>.field{margin:0}.C .field{margin:5px 0}.C .field span{font-size:12px;margin-bottom:3px}.C input,.C textarea{padding:5px 7px}.C .list{flex:1;min-height:0;overflow:auto;margin:0;border:1px solid #c4d2e3;background:#f6f9fe;padding:5px}.C .list button{flex-shrink:0;padding:5px 8px}.C .actions{margin:0;gap:5px;flex-shrink:0}.C .actions button,.C .panel>button{font-size:12px;padding:5px 8px}.C .pagebody>p{font-size:12px}.C .panel h3{font-size:14px;flex-shrink:0}.C .panel>.muted{font-size:12px;flex-shrink:0}.C .panel>.preview{flex:1;min-height:0;aspect-ratio:auto}.C .preview .scene{background-size:contain;font-size:16px}.C .preview small{font-size:11px}.C .reading{flex:1;min-height:0;overflow:auto;border:1px solid #c4d2e3;padding:8px;background:#f6f9fe;overflow-wrap:anywhere}.C .detailbody{flex:1;min-height:0;overflow:auto;background:#f6f9fe;border:1px solid #c4d2e3;padding:10px}.C .details-panel{grid-column:1/-1}.C .status{padding:6px 12px;min-height:48px;max-height:66px;gap:8px}.C .status .message{font-size:12px;max-height:46px}.C .status button{font-size:12px;padding:5px 8px}.C .single .panel{grid-column:1/-1}.C .compactPicker{display:block}@container(max-width:1100px){.C .nav{display:none}.C .worktitle{padding:6px 12px}.C .columns{grid-template-columns:1fr}.C .panel{padding:8px}.C .header .badge{font-size:10px}.C .header .path{font-size:12px}.C .compactPicker{font-size:0}.C .compactPicker select{font-size:12px}.C .status{max-height:58px}.C .status .message{max-height:38px}}

<div class="tools"><strong>UI試作 / 実データ非接続</strong><label>表示倍率 <select id="dpi"><option>100</option><option>125</option><option>150</option></select>%</label><label>サイズ <select id="size"><option value=".7">小 · 70%</option><option value=".85" selected>中 · 85%</option><option value="1">大 · 最大化</option></select></label><label>データ <select id="fixture"><option value="data">表示中</option><option value="empty">空</option><option value="long">長いパス・本文</option></select></label><label>処理状態 <select id="scenario"><option value="idle">待機</option><option value="running">処理中</option><option value="success">完了</option><option value="failure">失敗</option></select></label><span id="dimensions"></span></div>
<div class="stage"><div class="app" id="app"></div></div>
<div class="switcher"><button id="prev" aria-label="前の案">←</button><span id="variantLabel"></span><button id="next" aria-label="次の案">→</button></div>
<dialog class="dialog" id="dialog"><div class="dialogbody" id="dialogbody"></div><div class="dialogfooter"><button id="close">取消・閉じる</button><button class="primary" id="confirm">確認（模擬）</button></div></dialog>
<script>
const groups=[['動画を準備',['取得・媒体操作']],['解析・切り出し',['人物・参照音声','頻出語','切り出し区間']],['編集・書き出し',['画面・字幕','補助素材','保存・書き出し']],['保存結果を確認',['保存済み情報']],['データを管理',['管理・保管']]];
const names={A:'上部タブ / バランス',B:'左ナビ / フォーム重視',C:'工程リスト / プレビュー重視'};
let variant=new URLSearchParams(location.search).get('variant')||'C';if(!names[variant])variant='C';
const state={group:0,tabs:[0,0,0,0,0],values:{},expanded:{},selected:{},views:{},pages:{},process:'idle',progress:0,fixture:'data'};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tab=()=>groups[state.group][1][state.tabs[state.group]],key=()=>tab();
function field(label,defaultValue=''){const id=key()+label;return `<label class="field"><span>${label}</span><input data-field="${esc(id)}" value="${esc(state.values[id]??defaultValue)}"></label>`}
function action(label,kind='',a='simulate'){return `<button class="${kind}" data-action="${a}" ${state.process==='running'&&a==='simulate'?'disabled':''}>${label}</button>`}
function list(items){return `<div class="list">${state.fixture==='empty'?'<p class="muted">まだデータがありません。上の操作で追加します（模擬）。</p>':items.map((s,i)=>`<button data-row="${i}" class="${(state.selected[key()]??0)===i?'active':''}" aria-pressed="${(state.selected[key()]??0)===i}">${esc(s)}</button>`).join('')}</div>`}
function cMain(form,result,primary){
 const source=document.createElement('template');source.innerHTML=form;
 const pages=[],actions=[];let heading='';
 for(const node of source.content.children){if(node.tagName==='H3'){heading=node.outerHTML;continue}if(node.classList.contains('actions')||node.tagName==='BUTTON'){actions.push(node.outerHTML);continue}if(node.tagName==='P'){actions.push(`<button data-action="info">▷ 補足説明</button>`);continue}pages.push({label:node.querySelector('span')?.textContent||node.querySelector('h3')?.textContent||(node.classList.contains('list')?'一覧・選択':'入力'),html:heading+node.outerHTML});heading=''}
 const page=Math.min(state.pages[key()]??0,Math.max(0,pages.length-1));state.pages[key()]=page;
 const view=state.views[key()]??'operation';
 const res=document.createElement('template');res.innerHTML=result;
 for(const p of res.content.querySelectorAll('p')){if(!p.classList.contains('muted')&&!p.classList.contains('notice'))p.classList.add('reading')}
 return `<div class="viewbar" aria-label="表示領域"><button data-view="operation" class="${view==='operation'?'active':''}">操作</button><button data-view="result" class="${view==='result'?'active':''}">結果・プレビュー</button><button data-view="details" class="${view==='details'?'active':''}">${view==='details'?'▽':'▷'} 詳細設定</button><button class="inspect" data-action="state">状態を見る</button></div><div class="columns" data-c-columns><section class="panel operation-panel"><div class="panelhead"><button data-page="-1" aria-label="前の入力項目" ${page===0?'disabled':''}>◁</button><select id="fieldPage" aria-label="入力項目">${pages.map((p,i)=>`<option value="${i}" ${page===i?'selected':''}>${i+1}/${pages.length} ${esc(p.label)}</option>`).join('')}</select><button data-page="1" aria-label="次の入力項目" ${page>=pages.length-1?'disabled':''}>▷</button></div><div class="pagebody">${pages[page]?.html||'<p>下の操作を選んでください。</p>'}</div><div class="actions">${actions.join('')}</div></section><section class="panel result-panel">${res.innerHTML}</section><section class="panel details-panel"><h3>${primary}</h3><div class="detailbody" aria-label="展開した詳細設定">${state.process==='failure'?'<p class="notice">⚠ 詳細設定値を確認してください。入力は保持しています。</p>':''}${field('詳細設定値','3')}<label class="field"><span>備考・追加指定</span><textarea data-field="${esc(key()+'備考')}">${esc(state.values[key()+'備考']??'')}</textarea></label><p class="muted">この展開領域だけをスクロールできます。</p></div><div class="actions"><button data-view="operation">◁ 操作へ戻る</button>${action('設定で再試行','primary')}</div></section></div>`;
}
function main(){let t=tab(),long=state.fixture==='long',file=long?'D:/作業用動画/非常に長いフォルダ名/2026年の配信アーカイブ/字幕と切り出し区間の確認用/名前が長い元動画サンプル.mp4':'sample.mp4';let form='',result='',primary='';
if(t==='取得・媒体操作'){form=field('認証不要のURL','https://example.invalid/sample')+'<div class="actions">'+action('動画を取得','primary')+action('ローカル動画を選択','','file')+'</div>';result='<h3>動画素材</h3>'+list([file,'sample_02.mp4'])+'<p class="muted">動画素材と音声成果物を分けて表示</p>'+action('媒体情報を確認','','preview');primary='取得の詳細設定'}
if(t==='人物・参照音声'){form='<h3>対象話者</h3>'+list(['人物A · 参照音声 2件','人物B · 参照音声 1件'])+field('対象動画',file)+'<div class="actions">'+action('対象話者を照合','primary')+action('文字起こし','primary')+action('参照音声を登録','','file')+'</div>';result='<h3>対象話者の文字起こし</h3>'+list(['00:12–00:18 · 発話 · ここから始めます','00:18–00:24 · 不明区間 · 試聴して確認','00:24–00:31 · 対象話者の非発話区間'])+'<div class="actions">'+action('試聴','','preview')+action('発話に指定')+action('非発話に指定')+'</div>'+field('本文',long?'長い本文の折り返しと入力保持を確認します。'.repeat(12):'ここから始めます');primary='照合・文字起こしの詳細設定'}
if(t==='頻出語'){form=field('登録語','ClipChannel')+field('除外語','えっと')+'<div class="actions">'+action('頻出語を集計','primary')+action('登録語を追加')+'</div>';result='<h3>頻出語の集計</h3>'+list(['ゲーム · 32回','配信 · 18回','ClipChannel · 9回']);primary='集計の詳細設定'}
if(t==='切り出し区間'){form=field('開始時刻','00:12.000')+field('終了時刻','00:31.000')+'<div class="actions">'+action('区間を追加','primary')+action('分割')+action('区間結合')+action('上へ')+action('下へ')+action('区間を削除','danger','delete')+'</div>';result='<h3>切り出し区間 / 編集用動画の順序</h3>'+list(['01 · 00:12–00:31 · オープニング','02 · 03:15–03:48 · 見どころ'])+action('編集用動画を生成','primary');primary='前後余白の詳細設定'}
if(t==='画面・字幕'){form=field('編集用動画',file)+field('編集用字幕の本文','ここから始めます')+'<div class="actions">'+action('画面・字幕を適用','primary')+action('字幕を取り込む')+action('プレビュー','','preview')+'</div>';result='<h3>編集用動画プレビュー</h3><div class="preview"><div class="scene">動画全体 / 16:9</div><small>ここから始めます</small></div><p class="muted">編集用字幕の変更は元の文字起こしへ反映しません。</p>';primary='画面・字幕の詳細設定'}
if(t==='補助素材'){form=field('素材ファイル','background.png')+field('配置開始','00:05.000')+'<div class="actions">'+action('補助素材を追加','primary')+action('素材を選択','','file')+action('素材を削除','danger','delete')+'</div>';result='<h3>画像・BGM・効果音</h3>'+list(['画像 · background.png','BGM · music.wav','効果音 · effect.wav'])+action('補助素材プレビュー','','preview');primary='位置・音量の詳細設定'}
if(t==='保存・書き出し'){form=field('編集名','sample_edit_01')+'<div class="actions">'+action('明示保存','primary')+action('保存して書き出す','primary','export')+action('設定を確認','','settings')+'</div><p class="muted">旧動画・旧編集を残して別フォルダに保存します。</p>';result='<h3>保存・書き出し先（架空）</h3>'+list(['media/edits/sample_edit_01/','projects/sample_edit_01/','exports/sample_edit_01.mp4']);primary='出力の詳細設定'}
if(t==='保存済み情報'){form='<h3>解析結果 / 旧版も保持</h3>'+list(['sample / 文字起こし / sample_v1.csv','sample / 区間一覧 / sample_v2.csv','sample / 頻出語集計 / sample_v1.csv'])+action('表示内容を確認','','preview');result='<h3>選択したCSVの内容</h3><p style="overflow-wrap:anywhere">'+(state.fixture==='empty'?'結果を選択すると内容を表示します。':esc(long?'長い本文が続く場合にも領域内で折り返します。'.repeat(30):'開始 12.000 / 終了 18.000 / 本文 ここから始めます'))+'</p>';primary='表示の詳細設定'}
if(t==='管理・保管'){form='<h3>データ用フォルダ（架空）</h3>'+list([file,'catalog/sample/','archives/sample.zip'])+'<div class="actions">'+action('保管する','primary')+action('フォルダを切替','','file')+action('削除','danger','delete')+'</div>';result='<h3>保管内容</h3><p>選択した動画・解析結果の確認領域</p><p class="notice">注意：削除前に対象を確認してください。</p>';primary='保管の詳細設定'}
if(variant==='C')return cMain(form,result,primary);
return `<div class="columns"><section class="panel">${form}<details data-detail ${state.expanded[key()]?'open':''}><summary>${primary}</summary>${state.process==='failure'?'<p class="notice">⚠ 設定を確認してください。入力値は保持しています。</p>':''}${field('詳細設定値','3')}<label class="field"><span>備考・追加指定</span><textarea data-field="${esc(key()+'備考')}">${esc(state.values[key()+'備考']??'')}</textarea></label></details></section><section class="panel">${result}<div class="actions"><button disabled>選択なしでは実行できません</button></div></section></div><div class="legend"><span style="--color:#2165c1">青：主要操作</span><span style="--color:#8296ad">補助操作</span><span style="--color:#ac2334">赤：注意操作</span><span style="--color:#287248">緑：成功</span><span style="--color:#ba8b21">黄：警告</span></div><details><summary>試作の状態を見る（メモリ内のみ）</summary><pre class="state">${esc(JSON.stringify(state,null,2))}</pre></details>`}
function status(){let text={idle:'待機中 · 作業は手動で切り替えられます。',running:'処理中 · '+state.progress+'% · 入力と選択を保持しています。',success:'✓ 完了 · 次の作業へ進めます。画面は自動で切り替わりません。',failure:'⚠ 失敗 · 詳細設定を開いて該当項目を確認してください。'}[state.process];if(state.fixture==='long')text+=' 長い処理状態文とファイル名が続いても、中止ボタンは独立した領域に表示します。'.repeat(6);return `<div class="message" role="status">${esc(text)}${state.process==='running'?`<progress value="${state.progress}" max="100"></progress>`:''}${state.process==='success'?action('次の作業へ','','advance'):''}</div><button class="danger" id="stop" ${state.process!=='running'?'disabled':''}>■ 中止</button>`}
function render(){ $('app').className='app '+variant;$('app').innerHTML=`<header class="header"><div><span class="badge">PROTOTYPE · 架空データ</span><h1>ClipChannelAPP</h1></div><div class="path">${state.fixture==='long'?'D:/非常に長い保存先フォルダ名/'.repeat(5):'D:/ClipChannel-demo/'}<br><small>入力・処理はメモリ内のみ / 再読み込みで初期化</small></div>${action('フォルダ切替','','file')}</header><div class="shell"><nav class="nav" aria-label="作業分類">${groups.map((g,i)=>`<button data-group="${i}" class="${i===state.group?'active':''}" aria-pressed="${i===state.group}"><small>${String(i+1).padStart(2,'0')}</small> ${g[0]}</button>`).join('')}</nav><section class="workspace"><div class="worktitle"><h2>${groups[state.group][0]}</h2><label class="compactPicker">作業を切替 <select id="groupSelect">${groups.map((g,i)=>`<option value="${i}" ${i===state.group?'selected':''}>${g[0]}</option>`).join('')}</select></label><span class="muted">手動切替 · 入力を保持</span></div><nav class="tabs" aria-label="機能">${groups[state.group][1].map((t,i)=>`<button data-tab="${i}" class="${state.tabs[state.group]===i?'active':''}" aria-pressed="${state.tabs[state.group]===i}">${t}</button>`).join('')}</nav><div class="content">${main()}</div></section></div><footer class="status ${state.process}" id="status">${status()}</footer>`;$('variantLabel').textContent=variant+' · '+names[variant];resize();}
function resize(){const factor=Number($('size').value),dpi=Number($('dpi').value)/100,w=Math.round(1920/dpi*factor),h=Math.round(1040/dpi*factor);$('app').style.width=w+'px';$('app').style.height=h+'px';$('dimensions').textContent=`模擬 ${w} × ${h} CSS px（作業領域1920×1040想定）`;cLayout(w);}
function cLayout(w){if(variant!=='C')return;const view=state.views[key()]??'operation',single=w<=1100||view==='details',columns=document.querySelector('[data-c-columns]');columns.classList.toggle('single',single);document.querySelector('.operation-panel').hidden=view==='details'||(single&&view!=='operation');document.querySelector('.result-panel').hidden=view==='details'||(single&&view!=='result');document.querySelector('.details-panel').hidden=view!=='details';}
function switchVariant(delta){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}
function setProcess(p){state.process=p;if(p==='failure'){state.expanded[key()]=true;state.views[key()]='details'}$('scenario').value=p;render()}
function modal(type){$('dialogbody').innerHTML=type==='preview'?'<h2>プレビュー（架空）</h2><div class="preview"><div class="scene">画像全体 / 16:9</div></div><p>全体が収まるプレビュー。閉じる操作は下部に固定。</p>':`<h2>${type==='delete'?'削除の確認':type==='export'?'保存して書き出す':type==='file'?'素材・フォルダ選択の模擬':'設定の確認'}</h2><p class="notice">試作です。ファイル選択・保存・削除は実行しません。</p><p style="overflow-wrap:anywhere">対象：${esc('D:/架空データ/長いフォルダ名/'.repeat(10))}</p><details open><summary>確認内容</summary><p>入力値・選択は維持します。取消で元の画面へ戻れます。</p></details>`;$('dialog').showModal()}
const originalModal=modal;modal=function(type){if(type==='state'||type==='info'){ $('dialogbody').innerHTML=type==='state'?`<h2>試作の状態（メモリ内のみ）</h2><pre class="state">${esc(JSON.stringify(state,null,2))}</pre>`:'<h2>補足説明</h2><p>字幕の変更は元の文字起こしへ反映しません。旧動画・旧編集・解析結果の旧版は保持します。処理・保存はこの試作では実行しません。</p>';$('dialog').showModal();return}originalModal(type)};
$('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.views[key()]=b.dataset.view;state.expanded[key()]=b.dataset.view==='details';render()}else if(b.dataset.page){state.pages[key()]=(state.pages[key()]??0)+Number(b.dataset.page);render()}});
$('app').addEventListener('input',e=>{if(e.target.dataset.field)state.values[e.target.dataset.field]=e.target.value});$('app').addEventListener('change',e=>{if(e.target.id==='groupSelect'){state.group=Number(e.target.value);render()}else if(e.target.id==='fieldPage'){state.pages[key()]=Number(e.target.value);render()}});$('app').addEventListener('toggle',e=>{if(e.target.hasAttribute('data-detail'))state.expanded[key()]=e.target.open},true);
$('app').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.group!==undefined){state.group=Number(b.dataset.group);render()}else if(b.dataset.tab!==undefined){state.tabs[state.group]=Number(b.dataset.tab);render()}else if(b.dataset.row!==undefined){state.selected[key()]=Number(b.dataset.row);render()}else if(b.id==='stop'){setProcess('idle')}else if(b.dataset.action==='advance'){state.group=(state.group+1)%5;render()}else if(b.dataset.action==='simulate'){state.progress=0;setProcess('running')}else if(b.dataset.action)modal(b.dataset.action)});
$('prev').onclick=()=>switchVariant(-1);$('next').onclick=()=>switchVariant(1);document.addEventListener('keydown',e=>{if($('dialog').open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1)}});
$('dpi').onchange=resize;$('size').onchange=resize;$('fixture').onchange=()=>{state.fixture=$('fixture').value;render()};$('scenario').onchange=()=>setProcess($('scenario').value);$('close').onclick=()=>$('dialog').close();$('confirm').onclick=()=>{$('dialog').close();setProcess('success')};setInterval(()=>{if(state.process==='running'){state.progress=Math.min(100,state.progress+2);if(state.progress===100)setProcess('success');else $('status').innerHTML=status()}},1000);render();
</script></html>
